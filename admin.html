<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard – SyncNotes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">SyncNotes</div>
    <button class="btn" onclick="logout()">Logout</button>
</nav>

<!-- MAIN -->
<section style="padding:40px 60px;">

    <h1 style="font-size:36px; margin-bottom:10px;">Admin Dashboard</h1>
    <p style="color:#64748b; margin-bottom:40px;">
        Manage meetings and drive execution.
    </p>

    <!-- CREATE -->
    <div style="margin-bottom:30px;">
        <a href="create-meeting.html" class="btn primary">
            + Create New Meeting
        </a>
    </div>

    <!-- MEETINGS -->
    <h2 style="margin-bottom:20px;">Recent Meetings</h2>

    <!-- 👇 DYNAMIC CONTAINER -->
    <div id="meetingsList" class="features" style="justify-content:flex-start;">
        <!-- Meetings will load here -->
    </div>

</section>

<script src="js/script.js"></script>

<script>
function logout() {
    window.location.href = "login.html";
}

// 🔹 LOAD MEETINGS FROM BACKEND
fetch("http://127.0.0.1:5000/meetings")
    .then(res => res.json())
    .then(meetings => {
        const container = document.getElementById("meetingsList");

        if (meetings.length === 0) {
            container.innerHTML = "<p>No meetings created yet.</p>";
            return;
        }

        meetings.forEach(m => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h3>${m.title}</h3>
                <p>Date: ${m.datetime}</p>
                <a href="meeting.html" class="btn">Open</a>
            `;
            container.appendChild(card);
        });
    })
    .catch(() => {
        document.getElementById("meetingsList").innerHTML =
            "<p>Error loading meetings.</p>";
    });
</script>

</body>
</html>
