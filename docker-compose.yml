name: meetmind

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads
  # Lets containers reach Ollama running on your machine (optional local AI fallback)
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # One-shot job: applies database migrations, then exits.
  # api and worker only start after it succeeds (same pattern as a Kubernetes Job).
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *backend
    # Processes long-running jobs (transcription, AI analysis, emails)
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "meetmind"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  mailpit:
    # Catches every email MeetMind sends; view them at http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

  # Test runner — only started with: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test

volumes:
  pgdata:
  redisdata:
  uploads:
