<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Dashboard – SyncNotes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <h2 class="sidebar-logo">SyncNotes</h2>

        <ul class="menu">
            <li class="active">📅 My Meetings</li>
            <li>✅ My Tasks</li>
            <li>💬 AI Assistant</li>
            <li>🚪 Logout</li>
        </ul>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

        <!-- HEADER -->
        <header class="dashboard-header">
            <h1>Welcome, Member 👋</h1>
        </header>

        <!-- MEETINGS LIST -->
        <section class="meetings">

            <div class="meeting-card">
                <h3>Product Launch Sync</h3>
                <p>Date: 31 Jan 2026</p>
                <p>Your Tasks: <strong>2</strong></p>
                <button class="btn small">Open Meeting</button>
            </div>

            <div class="meeting-card">
                <h3>Engineering Weekly</h3>
                <p>Date: 29 Jan 2026</p>
                <p>Your Tasks: <strong>1</strong></p>
                <button class="btn small">Open Meeting</button>
            </div>

        </section>

    </main>
</div>

<script src="js/member.js"></script>
</body>
</html>
