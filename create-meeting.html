<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Meeting – SyncNotes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <h2 class="sidebar-logo">SyncNotes</h2>

        <ul class="menu">
            <li>📋 Meetings</li>
            <li class="active">➕ Create Meeting</li>
            <li>📊 Reports</li>
            <li>🚪 Logout</li>
        </ul>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

        <header class="dashboard-header">
            <h1>Create New Meeting</h1>
        </header>

        <!-- ===== FORM ===== -->
        <form class="meeting-form">

            <label>Meeting Title</label>
            <input type="text" placeholder="e.g. Product Launch Sync" required>

            <label>Meeting Agenda</label>
            <textarea placeholder="Discuss roadmap, assign tasks, finalize strategy" required></textarea>

            <label>Date & Time</label>
            <input type="datetime-local" required>

            <label>Participants (Emails)</label>
            <textarea placeholder="alex@email.com, maya@email.com" required></textarea>

            <label>Upload Audio / Video</label>
            <input type="file" accept="audio/*,video/*">

            <button type="submit" class="btn primary">
                Create Meeting
            </button>

        </form>

    </main>
</div>

<script src="js/create-meeting.js"></script>
</body>
</html>
