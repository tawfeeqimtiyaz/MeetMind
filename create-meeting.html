<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Meeting – SyncNotes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">SyncNotes</div>
    <a href="admin.html" class="btn">Back</a>
</nav>

<section style="padding:40px 60px; max-width:700px;">
    <h1 style="font-size:32px; margin-bottom:10px;">Create New Meeting</h1>
    <p style="color:#64748b; margin-bottom:30px;">
        Provide meeting details. AI processing will start after creation.
    </p>

    <input id="title" class="input" placeholder="Meeting Title" style="margin-bottom:15px;">
    <textarea id="agenda" class="input" placeholder="Meeting Agenda" style="margin-bottom:15px;"></textarea>
    <input id="datetime" type="datetime-local" class="input" style="margin-bottom:15px;">
    <input id="participants" class="input" placeholder="Participants (emails, comma separated)">

    <button class="btn primary" style="margin-top:20px;" onclick="createMeeting()">
        Create Meeting
    </button>
</section>

<script src="js/script.js"></script>
</body>
</html>
